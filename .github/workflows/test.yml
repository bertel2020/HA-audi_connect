name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  # Called by the release workflow, so nothing is released from a red tree.
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          # Home Assistant 2026.7 declares Requires-Python >=3.14.2.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        run: pytest

  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/js/package-lock.json

      - name: Install card test dependencies
        working-directory: tests/js
        run: npm ci

      - name: Test the dashboard card
        working-directory: tests/js
        run: npm test
