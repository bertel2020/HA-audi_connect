name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  # Called by the release workflow, so nothing is released from a red tree.
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Home Assistant 2026.7 declares Requires-Python >=3.14.2.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        run: pytest

  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/js/package-lock.json

      - name: Install card test dependencies
        working-directory: tests/js
        run: npm ci

      - name: Test the dashboard card
        working-directory: tests/js
        run: npm test
