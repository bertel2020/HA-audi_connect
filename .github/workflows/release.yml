name: Release
on:
  # Every push to master releases when its commits call for a new version
  # (feat, fix, breaking change); other commits release nothing. The version
  # commit the job pushes with the workflow token does not start a new run.
  push:
    branches: [master]
  workflow_dispatch:

# A second push while a release runs waits instead of racing the version commit.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    # Skip the version commit of an earlier release.
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: bump') }}"
    runs-on: ubuntu-latest
    # Pushing the version commit and tag, and creating the release, need write
    # access; the repository default is read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Gets semantic release info
        id: semantic_release_info
        uses: jossef/action-semantic-release-info@277fc891fc5ac40ed0e8d6bf59a0e24a25dfdeac # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Update Version and Commit
        if: ${{steps.semantic_release_info.outputs.version != ''}}
        env:
          VERSION: ${{ steps.semantic_release_info.outputs.version }}
          GIT_TAG: ${{ steps.semantic_release_info.outputs.git_tag }}
        run: |
          echo "Version: ${VERSION}"
          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/g" custom_components/audiconnect/manifest.json
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "chore: bumping version to ${VERSION}"
          git tag "${GIT_TAG}"

      - name: Push changes
        if: ${{steps.semantic_release_info.outputs.version != ''}}
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # v1.3.0
        with:
          github_token: ${{ github.token }}
          tags: true

      - name: Build the release notes with the support footer
        if: ${{steps.semantic_release_info.outputs.version != ''}}
        env:
          NOTES: ${{ steps.semantic_release_info.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
          cat .github/release-footer.md >> "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        if: ${{steps.semantic_release_info.outputs.version != ''}}
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag: ${{ steps.semantic_release_info.outputs.git_tag }}
          name: ${{ steps.semantic_release_info.outputs.git_tag }}
          bodyFile: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: false
