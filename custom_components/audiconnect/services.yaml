---
# Describes the format for available services for audiconnect

probe_api_paths:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    extended:
      selector:
        boolean:

refresh_cloud_data:

refresh_vehicle_data:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect

probe_api:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    jobs:
      required: false
      example: "[access, charging]"
      selector:
        object:
    path:
      required: false
      example: "capabilities"
      selector:
        text:
    graphql:
      required: false
      selector:
        select:
          options:
            - list
            - details
            - render_pictures
            - configuration

execute_vehicle_action:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    action:
      required: true
      example: "lock"
      selector:
        select:
          translation_key: vehicle_actions
          options:
            - lock
            - unlock
            - start_climatisation
            - stop_climatisation
            - start_charger
            - start_timed_charger
            - stop_charger
            - start_preheater
            - stop_preheater
            - start_window_heating
            - stop_window_heating

start_climate_control:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    temp_f:
      selector:
        number:
          min: 59
          max: 86
    temp_c:
      selector:
        number:
          min: 15
          max: 30
          step: 0.5
    glass_heating:
      selector:
        boolean:
    seat_fl:
      selector:
        boolean:
    seat_fr:
      selector:
        boolean:
    seat_rl:
      selector:
        boolean:
    seat_rr:
      selector:
        boolean:
    climatisation_at_unlock:
      selector:
        boolean:
    climatisation_mode:
      example: "comfort"
      selector:
        select:
          options:
            - comfort
            - economy

start_auxiliary_heating:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    duration:
      selector:
        number:
          min: 10
          max: 60
          step: 10
          unit_of_measurement: "minutes"

set_location_charge_target:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    profile_id:
      example: 1
      selector:
        number:
          min: 1
          max: 10
          step: 1
    target_soc:
      required: true
      example: 80
      selector:
        number:
          min: 20
          max: 100
          step: 5
          unit_of_measurement: "%"

set_charge_mode:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    charge_mode:
      required: true
      example: "manual"
      selector:
        select:
          options:
            - manual
            - timer

set_target_soc:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    target_soc:
      required: true
      example: 80
      selector:
        number:
          min: 20
          max: 100
          step: 5
          unit_of_measurement: "%"

start_engine:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect

stop_engine:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect

test_climatisation_write:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    setting:
      required: true
      selector:
        select:
          options:
            - targetTemperature
            - climatizationAtUnlock
            - windowHeatingEnabled
            - zoneFrontLeftEnabled
            - zoneFrontRightEnabled
            - zoneRearLeftEnabled
            - zoneRearRightEnabled
    value:
      required: true
      selector:
        object:
    variant:
      required: true
      selector:
        select:
          options:
            - full
            - without_window_heating
            - single_field
            - full_json
            - app_dto
            - app_full
    method:
      selector:
        select:
          options:
            - PUT
            - POST

create_climatisation_timer:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    time:
      required: true
      example: "07:30"
      selector:
        time:
    days:
      required: true
      selector:
        select:
          multiple: true
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
    repeat:
      default: true
      selector:
        boolean:
    enabled:
      default: true
      selector:
        boolean:

delete_climatisation_timer:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    timer_id:
      required: true
      selector:
        number:
          min: 0
          max: 99
          mode: box

set_climatisation_timer_enabled:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: audiconnect
    timer_id:
      required: true
      selector:
        number:
          min: 0
          max: 99
          mode: box
    enabled:
      required: true
      selector:
        boolean:
